[project]
name = "office-agent"
version = "0.1.0"
description = "基于 LangGraph + OfficeCLI 的交互式 Word 文档生成 Agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "python-dotenv>=1.2.2",
]

# src 布局：把 src/ 加入导入路径，main.py 用 from office_agent... 即可
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================
# office-agent 运行配置
# ============================================================
# 工程默认值；环境变量 / .env 同名变量优先级更高（可临时覆盖）。
# 敏感信息（如 LLM_API_KEY）请放在 .env（已在 .gitignore），不要写这里。
[tool.office-agent]
LLM_BASE_URL = "https://api.deepseek.com"
LLM_MODEL = "deepseek-v4-flash"
LLM_TEMPERATURE = "0.5"
LLM_REQUEST_TIMEOUT = "120"

OFFICECLI_TIMEOUT = "120"
OUTPUT_DIR = "./output"
MAX_ITERATIONS = "2"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
